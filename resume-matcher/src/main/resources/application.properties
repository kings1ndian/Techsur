# ----------------------------------------------------------------
# APPLICATION
# ----------------------------------------------------------------
spring.application.name=resume-matcher

# Change to a port you know is free (e.g. 8081)
server.port=8080

# ----------------------------------------------------------------
# AI / Ollama
# ----------------------------------------------------------------
# local Ollama HTTP endpoint
ollama.url=http://localhost:11434
# exact model name you want to use
ollama.model=llama3.2

# ----------------------------------------------------------------
# DATABASE (PostgreSQL)
# ----------------------------------------------------------------
# Your locally created DB name, user, and password
spring.datasource.url=jdbc:postgresql://localhost:5432/resume_matcher
spring.datasource.username=postgres
spring.datasource.password=Abhi@98852
# (optional) specify driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ----------------------------------------------------------------
# CORS (so React on localhost:3000 can call your API)
# ----------------------------------------------------------------
spring.mvc.cors.allowed-origins=http://localhost:3000
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true

# ----------------------------------------------------------------
# FILE UPLOAD
# ----------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB